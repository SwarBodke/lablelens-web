name: LableLens CI

on:
  push:
    branches:
      - rule-engine-2011-baseline
  pull_request:
    branches:
      - main

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run smoke and regression tests
        env:
          LABLELENS_OCR_LANGS: eng
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python smoke_test.py
